<!DOCTYPE html>
<html>

<head>

    <title>{{ job.title }} - JobConnect</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 70%;
            margin: 50px auto;
        }

        .job {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        h1 {
            color: #0d6efd;
        }

        .info {
            margin: 15px 0;
        }

        .apply-btn {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        .back {
            display: block;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="job">

        <h1>
            {{ job.title }}
        </h1>

        <div class="info">
            <strong>Company:</strong>
            {{ job.company }}
        </div>

        <div class="info">
            <strong>Location:</strong>
            {{ job.location }}
        </div>

        <div class="info">
            <strong>Category:</strong>
            {{ job.category }}
        </div>

        <div class="info">
            <strong>Salary:</strong>
            {{ job.salary }}
        </div>


        <hr>


        <h2>Description</h2>

        <p>
            {{ job.description }}
        </p>


        <h2>Requirements</h2>

        <p>
            {{ job.requirements }}
        </p>


        <a
            href="/jobs/{{ job.id }}/apply"
            class="apply-btn">

            Apply Now

        </a>


        <a
            href="/jobs"
            class="back">

            ← Back to Jobs

        </a>

    </div>

</div>

</body>

</html>
