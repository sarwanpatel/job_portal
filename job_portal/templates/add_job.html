<!DOCTYPE html>
<html>

<head>

    <title>Post Job</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px #ddd;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Post New Job</h1>

    <form method="POST">

        <label>Job Title</label>

        <input
            type="text"
            name="title"
            placeholder="e.g. Python Developer"
            required
        >


        <label>Company</label>

        <input
            type="text"
            name="company"
            placeholder="Company name"
            required
        >


        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="e.g. Delhi"
            required
        >


        <label>Category</label>

        <select name="category">

            <option value="Software Development">
                Software Development
            </option>

            <option value="Data Science">
                Data Science
            </option>

            <option value="Web Development">
                Web Development
            </option>

            <option value="Marketing">
                Marketing
            </option>

            <option value="Finance">
                Finance
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>Salary</label>

        <input
            type="text"
            name="salary"
            placeholder="e.g. ₹5-8 LPA"
        >


        <label>Description</label>

        <textarea
            name="description"
            placeholder="Describe the job..."
            required
        ></textarea>


        <label>Requirements</label>

        <textarea
            name="requirements"
            placeholder="Required skills and qualifications..."
        ></textarea>


        <button type="submit">
            Post Job
        </button>

    </form>

    <a
        href="/recruiter/dashboard"
        class="back">

        ← Back to Dashboard

    </a>

</div>

</body>

</html>
